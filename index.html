<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Σίφνος — Ο Οδηγός ενός Ντόπιου</title>
  <meta name="description" content="Παραλίες, φαγητό, ποτό και συμβουλές για τη Σίφνο από έναν ντόπιο." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ═══ HERO ═══════════════════════════════════════════════════════════════ -->
  <header class="hero" id="top">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-subtitle" id="hero-subtitle"></p>
      <p class="hero-description" id="hero-description"></p>
    </div>
    <button class="lang-toggle" id="lang-toggle" aria-label="Switch language"></button>
  </header>

  <!-- ═══ STICKY NAV ═════════════════════════════════════════════════════════ -->
  <nav class="sticky-nav" id="sticky-nav" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="#top" class="nav-home" aria-label="Back to top">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <div class="nav-links" id="nav-links" role="list"></div>
      <button class="lang-toggle lang-toggle--small" id="lang-toggle-nav" aria-label="Switch language"></button>
    </div>
  </nav>

  <!-- ═══ MAIN ════════════════════════════════════════════════════════════════ -->
  <main>

    <!-- Beaches -->
    <section class="section" id="beaches">
      <div class="container">
        <div id="beaches-header"></div>
        <div id="beaches-body"></div>
      </div>
    </section>

    <!-- Drinks -->
    <section class="section section--alt" id="drinks">
      <div class="container">
        <div id="drinks-header"></div>
        <div id="drinks-body"></div>
      </div>
    </section>

    <!-- Food -->
    <section class="section" id="food">
      <div class="container">
        <div id="food-header"></div>
        <div id="food-body"></div>
      </div>
    </section>

    <!-- Tips -->
    <section class="section section--alt" id="tips">
      <div class="container">
        <div id="tips-header"></div>
        <div id="tips-body"></div>
      </div>
    </section>

  </main>

  <!-- ═══ FOOTER ══════════════════════════════════════════════════════════════ -->
  <footer class="footer">
    <div class="container">
      <a class="bmac-btn" href="#" target="_blank" rel="noopener noreferrer">
        ☕ Buy me a coffee
      </a>
      <p class="footer-text">
        Made with ♥ by a local &nbsp;·&nbsp; Σίφνος
      </p>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
