<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Σίφνος — Ο Οδηγός ενός Ντόπιου</title>
  <meta name="description" content="Παραλίες, φαγητό, ποτό και συμβουλές για τη Σίφνο από έναν ντόπιο." />
  <meta name="theme-color" content="#1a4f7a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ═══ APP BAR ═════════════════════════════════════════════════════════════
       Contents are swapped per route by renderAppbar(): on Home it shows the
       island name, elsewhere a back arrow + section title. -->
  <header class="appbar" id="appbar">
    <div class="appbar-inner">
      <button class="appbar-btn appbar-back" id="appbar-back" hidden></button>
      <a class="appbar-btn appbar-home" id="appbar-home" href="#/" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <a class="appbar-brand" id="appbar-brand" href="#/"></a>
      <h1 class="appbar-title" id="appbar-title"></h1>

      <!-- Desktop-only inline section nav -->
      <nav class="appbar-links" id="appbar-links" aria-label="Sections"></nav>

      <button class="appbar-btn appbar-search" id="appbar-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="appbar-btn lang-toggle" id="lang-toggle"></button>
    </div>
  </header>

  <!-- ═══ VIEW ════════════════════════════════════════════════════════════════
       The router renders exactly one view here. -->
  <main class="view" id="view" tabindex="-1"></main>

  <!-- ═══ BOTTOM TAB BAR (mobile) ════════════════════════════════════════════ -->
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>

  <!-- ═══ DETAIL SHEET ════════════════════════════════════════════════════════
       Opens over the current view so you never lose your place. -->
  <div class="sheet-scrim" id="sheet" hidden>
    <div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grabber" id="sheet-grabber" aria-hidden="true"><span></span></div>
      <button class="sheet-close" id="sheet-close"></button>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <!-- ═══ "MORE" DRAWER (mobile) ══════════════════════════════════════════════ -->
  <div class="drawer-scrim" id="drawer" hidden>
    <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <span class="drawer-title" id="drawer-title"></span>
        <button class="drawer-close" id="drawer-close"></button>
      </div>
      <nav class="drawer-links" id="drawer-links" aria-label="Sections"></nav>
      <div class="drawer-actions">
        <a class="bmac-btn" href="#" target="_blank" rel="noopener noreferrer">☕ Buy me a coffee</a>
        <a class="contact-link" href="#" target="_blank" rel="noopener noreferrer">✉ Contact Us</a>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
